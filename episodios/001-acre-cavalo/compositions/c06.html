  <script>

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#c06-mapa-in, #c06-pontos-in", { scale: 1.08 }, { scale: 1, duration: D, ease: "none" }, 0);
    tl.fromTo("#c06-titulo", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, T("borracha") - 0.25);
    // rios se desenham em "subiram os rios"
    tl.fromTo("#c06-mapa .rio", { strokeDasharray: 3000, strokeDashoffset: 3000 }, { strokeDashoffset: 0, duration: 1.4, stagger: 0.12, ease: "power2.out" }, T("borracha"));

    tl.fromTo("#c06-pontos .ponto", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.12, ease: "back.out(3)", stagger: (p1 - p0) / 220 }, p0);
