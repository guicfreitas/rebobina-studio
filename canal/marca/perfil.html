<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:LG;src:url(../../templates/base-video/assets/fonts/LeagueGothic.woff2)}
@font-face{font-family:SM;src:url(../../templates/base-video/assets/fonts/SpaceMono-700.woff2);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#333;display:flex;gap:40px;padding:40px;flex-wrap:wrap;width:3300px}
.p{width:1024px;height:1024px;position:relative;overflow:hidden}
.scan::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 3px,transparent 3px 8px);pointer-events:none}
.vin::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 45%,rgba(0,0,0,.5) 100%);z-index:3;pointer-events:none}
/* A: rebobinar */
#a{background:#0e0d10}
#a svg{position:absolute;left:50%;top:50%;width:640px;height:420px;margin:-250px 0 0 -320px}
#a .rec{position:absolute;left:300px;top:690px;font:700 64px SM;color:#f1e8d3;letter-spacing:.08em;text-shadow:5px 0 rgba(255,59,48,.6),-5px 0 rgba(63,167,255,.6)}
#a .rec i{display:inline-block;width:46px;height:46px;border-radius:50%;background:#ff3b30;margin-right:26px;vertical-align:2px}
/* B: tela azul */
#b{background:#2335d9}
#b .t{position:absolute;left:0;right:0;text-align:center;color:#fff}
#b .rew{top:250px;font:700 72px SM;letter-spacing:.1em}
#b .nome{top:350px;font:260px/0.9 LG;letter-spacing:.02em;text-shadow:7px 0 rgba(255,59,48,.55),-7px 0 rgba(63,212,255,.55)}
#b .cont{top:640px;font:700 60px SM;letter-spacing:.12em;opacity:.9}
/* C: fita */
#c{background:#ffd23f}
#c .fita{position:absolute;left:112px;top:262px;width:800px;height:500px;background:#17151c;border-radius:34px;box-shadow:0 30px 0 rgba(0,0,0,.25)}
#c .rot{position:absolute;left:60px;top:44px;width:680px;height:250px;background:#f1e8d3;border-radius:10px;overflow:hidden}
#c .rot .faixa{position:absolute;left:0;right:0;top:0;height:56px;background:#ff3b30}
#c .rot .n{position:absolute;left:0;right:0;top:60px;text-align:center;font:190px/1 LG;color:#1b1a17;letter-spacing:.02em}
#c .jan{position:absolute;left:190px;top:320px;width:420px;height:130px;background:#0e0d10;border-radius:65px;border:8px solid #2b2933}
#c .bob{position:absolute;top:21px;width:72px;height:72px;border-radius:50%;background:#f1e8d3;border:14px solid #8f8a99}
#c .b1{left:40px}#c .b2{right:40px}
#c .seta{position:absolute;left:148px;top:38px;font:700 50px SM;color:#ffd23f;letter-spacing:-.1em}
</style></head><body>
<div class="p scan vin" id="a">
 <svg viewBox="0 0 640 420">
  <g transform="translate(-10,0)" fill="#ff3b30" opacity=".7"><polygon points="300,30 300,390 20,210"/><polygon points="620,30 620,390 340,210"/></g>
  <g transform="translate(10,0)" fill="#3fa7ff" opacity=".7"><polygon points="300,30 300,390 20,210"/><polygon points="620,30 620,390 340,210"/></g>
  <g fill="#ffd23f"><polygon points="300,30 300,390 20,210"/><polygon points="620,30 620,390 340,210"/></g>
 </svg>
 <div class="rec"><i></i>REW</div>
</div>
<div class="p scan vin" id="b">
 <div class="t rew">◀◀ REW</div>
 <div class="t nome">REBOBINA</div>
 <div class="t cont">HISTÓRIA REAL</div>
</div>
<div class="p scan" id="c">
 <div class="fita"><div class="rot"><div class="faixa"></div><div class="n">REBOBINA</div></div>
  <div class="jan"><div class="bob b1"></div><div class="seta">◀◀</div><div class="bob b2"></div></div></div>
</div>
</body></html>
